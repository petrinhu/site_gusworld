<style>
/* ============================================================
   Glyfesse, pagina "em breve" (Edicao #0 no CRT real do lider).
   Mock 04. HTML5 + CSS. JS minimo so para os caracteres-glitch.
   Moldura: crt-bezel.png (frame do video de boot dos registros dele).
   Interior: o placeholder da Hostinger, esmaecido, com efeito de CRT.
   ============================================================ */

@font-face{
  font-family:"PixelOperatorMono";
  src:url("assets/PixelOperatorMono.woff2") format("woff2");
  font-weight:400; font-display:swap;
}
@font-face{
  font-family:"PixelOperatorMono";
  src:url("assets/PixelOperatorMono-Bold.woff2") format("woff2");
  font-weight:700; font-display:swap;
}

:root{
  --navy:      #0d1520;
  --ciano:     #4dd9e8;   /* fosforo aceso: passa 10.83:1 sobre navy */
  --ciano-alto:#6ff0ff;
}

*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  background:radial-gradient(120% 90% at 18% 8%, #17171d 0%, #070709 60%);
  display:grid; place-items:center; min-height:100vh;
  padding:clamp(8px,3vw,48px);
  font-family:"PixelOperatorMono",ui-monospace,monospace;
  overflow:hidden;
}

/* ---------- O MONITOR (imagem real) ---------- */
.palco{
  position:relative;
  width:min(94vw, 1000px);
  aspect-ratio:1280 / 720;
  filter:drop-shadow(0 40px 70px rgba(0,0,0,.7));
}
.palco>img{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; user-select:none; -webkit-user-drag:none;
}

/* ---------- A TELA (area util dentro da moldura) ---------- */
.tela{
  position:absolute;
  top:5.2%; left:13%; right:12.5%; bottom:5%;
  overflow:hidden;
  border-radius:14% / 20%;
  isolation:isolate;
}

/* o placeholder da Hostinger, fantasma no tubo aceso */
.fantasma{
  position:absolute; inset:-6%;
  background:url("assets/placeholder-hostinger.png") center/cover no-repeat;
  filter:grayscale(1) brightness(.28) contrast(.85) blur(1.4px) hue-rotate(140deg);
  mix-blend-mode:screen; opacity:.09;
}

/* brilho do fosforo: glow ciano central + vinheta */
.tela::before{
  content:""; position:absolute; inset:0; z-index:3; pointer-events:none;
  background:
    radial-gradient(120% 120% at 50% 46%, rgba(77,217,232,.12) 0%, transparent 48%),
    radial-gradient(140% 140% at 50% 50%, transparent 52%, rgba(0,0,0,.55) 100%);
}
/* camera filmando CRT: scanlines + trama rgb de fosforo */
.tela::after{
  content:""; position:absolute; inset:0; z-index:4; pointer-events:none;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(255,0,0,.03) 0 1px, rgba(0,255,0,.03) 1px 2px, rgba(0,0,255,.03) 2px 3px);
  mix-blend-mode:multiply;
}

/* ---------- CONTEUDO NA TELA ---------- */
.conteudo{position:absolute; inset:0; z-index:5}

/* "Gusworld", direita, distante da lateral */
.selo{
  position:absolute; top:8%; right:9%;
  font-size:clamp(11px,1.9vw,19px); font-weight:700;
  letter-spacing:.16em; color:var(--ciano);
  text-shadow:0 0 7px rgba(77,217,232,.85), 1.5px 0 0 rgba(255,0,64,.4), -1.5px 0 0 rgba(0,255,255,.35);
}
.selo b{color:var(--ciano-alto)}
.selo .dom{display:block; margin-top:.4em; font-weight:400;
  font-size:.6em; letter-spacing:.24em; color:#8ec6ce; text-shadow:none; text-align:right}

/* SOON + EM BREVE, centro */
.centro{position:absolute; inset:0; display:grid; place-content:center; text-align:center}
.soon{
  font-weight:700; letter-spacing:.14em; line-height:1;
  font-size:clamp(40px,11vw,120px); color:var(--ciano-alto);
  text-shadow:
    0 0 12px rgba(111,240,255,.8), 0 0 34px rgba(77,217,232,.45),
    3px 0 0 rgba(255,0,72,.55), -3px 0 0 rgba(0,238,255,.5);
  animation:tremor 5.5s infinite;
}
.embreve{
  margin-top:.55em; font-weight:400;
  font-size:clamp(13px,3vw,26px); letter-spacing:.42em;
  color:var(--ciano); text-shadow:0 0 8px rgba(77,217,232,.65); opacity:.94;
}
.cursor{display:inline-block; width:.6em; height:1em; margin-left:.18em;
  background:var(--ciano-alto); vertical-align:-.12em;
  animation:blink 1.06s steps(1) infinite; box-shadow:0 0 9px var(--ciano)}
@keyframes blink{50%{opacity:0}}
@keyframes tremor{0%,92%,100%{transform:translate(0,0)}93%{transform:translate(-2px,1px)}95%{transform:translate(1px,-1px)}97%{transform:translate(-1px,0)}}

/* ---------- OS GLITCHES ---------- */
/* rolagem vertical (v-hold roll): tarja preta pouco opaca descendo devagar */
.roll{
  position:absolute; left:0; right:0; z-index:6; pointer-events:none; height:18%;
  background:linear-gradient(180deg, transparent, rgba(0,0,0,.5) 45%, rgba(0,0,0,.5) 55%, transparent);
  animation:roll 8s linear infinite;
}
@keyframes roll{0%{top:-20%}100%{top:100%}}

/* linhas brancas horizontais que cruzam de um lado a outro */
.risco{position:absolute; left:0; right:0; z-index:6; height:2px;
  background:rgba(255,255,255,.85); pointer-events:none; opacity:0;
  box-shadow:0 0 6px rgba(255,255,255,.7)}
.risco.a{top:34%; animation:risco 6.3s steps(1) infinite}
.risco.b{top:61%; height:1px; animation:risco 4.1s steps(1) infinite .8s}
.risco.c{top:18%; animation:risco 9s steps(1) infinite 2.2s}
@keyframes risco{
  0%,49.4%,50.6%,100%{opacity:0; transform:translateX(-4%)}
  49.7%{opacity:.9; transform:translateX(0)}
  50.3%{opacity:.9; transform:translateX(3%)}
}

/* caracteres de "binario num leitor ascii", spawn por JS */
#lixo{position:absolute; inset:0; z-index:6; pointer-events:none}
.g{position:absolute; color:var(--ciano); font-size:clamp(10px,1.7vw,16px);
  text-shadow:0 0 6px rgba(77,217,232,.7); opacity:0; white-space:pre}

/* flicker geral leve do tubo */
.tela{animation:tubo 6.1s infinite steps(1)}
@keyframes tubo{0%,4%,100%{filter:brightness(1)}2%{filter:brightness(1.05)}3%{filter:brightness(.98)}}

/* o Gus, canto inferior esquerdo da tela, ESTATICO (nao anima) */
.gus{
  position:absolute; z-index:5; left:3.5%; bottom:1.5%;
  height:23%; width:auto; pointer-events:none;
  image-rendering:pixelated;                 /* pixel art: nunca borrar */
  filter:drop-shadow(0 0 5px rgba(77,217,232,.35));  /* leve halo de tubo */
}

/* versao na tela, tipo firmware de BIOS/CRT */
.versao{position:absolute; z-index:5; right:9%; bottom:6%;
  font-size:clamp(9px,1.3vw,13px); letter-spacing:.14em;
  color:var(--ciano); opacity:.55; text-shadow:0 0 5px rgba(77,217,232,.5)}

.baixo{position:fixed; bottom:12px; left:0; right:0; z-index:9; text-align:center;
  font-size:11px; letter-spacing:.3em; color:#41414b}

/* movimento reduzido: some o movimento, fica a imagem */
@media (prefers-reduced-motion:reduce){
  .roll,.risco,#lixo{display:none}
  .soon,.tela,.cursor{animation:none}
  .cursor{opacity:1}
}
</style>

<div class="palco">
  <img src="assets/crt-bezel.png" alt="Monitor CRT antigo dando boot">
  <div class="tela">
    <div class="fantasma" aria-hidden="true"></div>
    <div class="conteudo">
      <p class="selo"><b>GUS</b>WORLD<span class="dom">gusworld.site</span></p>
      <p class="versao">V0.0.0.0...</p>
      <div class="centro">
        <div class="soon">SOON</div>
        <div class="embreve">EM BREVE<span class="cursor" aria-hidden="true"></span></div>
      </div>
    </div>
    <img class="gus" src="assets/gus-front.png" alt="Gus, o protagonista">
    <div class="roll" aria-hidden="true"></div>
    <div class="risco a" aria-hidden="true"></div>
    <div class="risco b" aria-hidden="true"></div>
    <div class="risco c" aria-hidden="true"></div>
    <div id="lixo" aria-hidden="true"></div>
  </div>
</div>

<p class="baixo">GLYFESSE // EDICAO #0 // 2026</p>

<script>
/* caracteres-glitch: aparecem e somem em posicoes aleatorias, como um
   binario aberto num leitor de texto ascii. JS minimo (a stack permite),
   e desligado quando o usuario pede menos movimento. */
(function(){
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  var tela = document.getElementById("lixo");
  var chars = ["%","<","\\","#","~","^","}","|","0x","NUL","BS","CR","FF","1101","::","@","]","&","??","█","▓"];
  function r(n){ return Math.floor(Math.random()*n); }
  function solta(){
    var el = document.createElement("span");
    el.className = "g";
    el.textContent = chars[r(chars.length)];
    el.style.left = r(92)+"%";
    el.style.top  = r(88)+"%";
    tela.appendChild(el);
    el.animate(
      [{opacity:0},{opacity:.85, offset:.2},{opacity:.85, offset:.6},{opacity:0}],
      {duration: 500 + r(900)}
    ).onfinish = function(){ el.remove(); };
    setTimeout(solta, 120 + r(360));
  }
  solta(); setTimeout(solta, 200); setTimeout(solta, 400);
})();
</script>
