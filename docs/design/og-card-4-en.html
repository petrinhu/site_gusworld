<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glyfesse #4 The Face and the Voice, OG card 1200x630 (EN)</title>

<!-- O GEMEO EN de og-card-4.html (Edicao #4). A CAPA da estante do /en/ tem
     que estar em ingles; o card SOCIAL (og:image) segue sendo o de PORTUGUES
     nos dois idiomas (ver a nota da #1), entao este arquivo gera SO' a arte
     de capa, nunca a meta tag.
     Desenho: og-card.css (chassi) + og-card-4.css (o painel do rosto do Gus). O
     que muda aqui e' so' o TEXTO; o acento ciano cai na MESMA parte da frase.
     Render: ver o cabecalho de og-card.css. Saida: public_html/assets/og-edicao-4-en.jpg. -->
<link rel="stylesheet" href="og-card.css">
<link rel="stylesheet" href="og-card-4.css">
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="prompt">root@glyfesse&gt; <b>glyfe</b> --edition 4</span>
      <span class="vol">vol.1 · #4 · the face and the voice</span>
    </div>

    <div class="mid">
      <div class="wordmark">GLYFESSE</div>
      <p class="tagline">A face arrived for the blue square, and weeks later <span class="acc">somebody in the world finally opened their mouth to answer</span>.</p>
    </div>

    <div class="foot">
      <span class="voz">// by <b>Gus</b>, who finally has a face to match the voice</span>
      <span class="url">gusworld.site</span>
    </div>
  </div>

  <div class="tela" aria-hidden="true">
    <span class="interior">
      <img class="frame" src="../../public_html/assets/frames/edicao-4.png" alt="">
      <span class="varredura"></span>
      <span class="vinheta"></span>
    </span>
  </div>
</body>
</html>
