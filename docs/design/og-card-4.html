<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Glyfesse #4 O Rosto e a Voz, OG card 1200x630</title>

<!-- Card social 1200x630 da Edicao #4, em PORTUGUES. O gemeo em ingles (a CAPA
     da estante do /en/) e' og-card-4-en.html: mesmo desenho, so' o texto muda.
     Desenho: og-card.css (chassi) + og-card-4.css (o painel do rosto do Gus).
     Render: ver o cabecalho de og-card.css. Saida publicada em
     public_html/assets/og-edicao-4.jpg (social, pt) e og-edicao-4-en.jpg (capa en). -->
<link rel="stylesheet" href="og-card.css">
<link rel="stylesheet" href="og-card-4.css">
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="prompt">root@glyfesse&gt; <b>glyfe</b> --edicao 4</span>
      <span class="vol">vol.1 · #4 · o rosto e a voz</span>
    </div>

    <div class="mid">

      <p class="tagline">Um rosto chegou para o quadrado azul, e semanas depois <span class="acc">alguém no mundo abriu a boca para responder pela primeira vez</span>.</p>

    <div class="foot">
      <span class="voz">// por <b>Gus</b>, que finalmente tem um rosto pra combinar com a voz</span>
      <span class="url">gusworld.site</span>
    </div>
  </div>

  <div class="tela" aria-hidden="true">
    <span class="interior">
      <img class="frame" src="../../public_html/assets/frames/edicao-4.png" alt="">
      <span class="varredura"></span>
      <span class="vinheta"></span>
    </span>
