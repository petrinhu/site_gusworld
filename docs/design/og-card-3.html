<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Glyfesse #3 O Quadrado Azul, OG card 1200x630</title>

<!-- Card social 1200x630 da Edicao #3, em PORTUGUES. O gemeo em ingles (a CAPA
     da estante do /en/) e' og-card-3-en.html: mesmo desenho, so' o texto muda.
     Desenho: og-card.css (chassi) + og-card-3.css (a tela com a captura real).
     Render: ver o cabecalho de og-card.css. Saida publicada em
     public_html/assets/og-edicao-3.jpg (social, pt) e og-edicao-3-en.jpg (capa en). -->
<link rel="stylesheet" href="og-card.css">
<link rel="stylesheet" href="og-card-3.css">
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="prompt">root@glyfesse&gt; <b>glyfe</b> --edicao 3</span>
      <span class="vol">vol.1 · #3 · o quadrado azul</span>
    </div>

    <div class="mid">
      <div class="wordmark">GLYFESSE</div>
      <p class="tagline">A primeira coisa jogável:<br><span class="acc">um quadrado azul que anda</span>,<br>escorrega e esbarra nas paredes.</p>
    </div>

    <div class="foot">
      <span class="voz">// por <b>Gus</b>, que naquele mês ainda era um quadrado</span>
      <span class="url">gusworld.site</span>
    </div>
  </div>

  <div class="tela" aria-hidden="true">
    <span class="interior">
      <img class="frame" src="../../public_html/assets/frames/edicao-3.png" alt="">
      <span class="varredura"></span>
      <span class="vinheta"></span>
    </span>
  </div>
</body>
</html>
