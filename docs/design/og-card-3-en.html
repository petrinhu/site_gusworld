<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glyfesse #3 The Blue Square, OG card 1200x630 (EN)</title>
<!-- ★ O GEMEO EN de og-card-3.html (Edicao #3). Existe porque a CAPA da estante
     do /en/ tem que estar em ingles (ordem do lider, 2026-07-25): o card SOCIAL
     (og:image) segue sendo o de PORTUGUES nos dois idiomas, entao este arquivo
     gera SO' a arte de capa, nunca a meta tag.
     Desenho: og-card.css (chassi) + og-card-3.css (a tela com a captura real). O
     que muda aqui e' so' o TEXTO; o acento ciano cai na MESMA parte da frase.
     Render: ver o cabecalho de og-card.css. Saida: public_html/assets/og-edicao-3-en.jpg. -->
<link rel="stylesheet" href="og-card.css">
<link rel="stylesheet" href="og-card-3.css">
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="prompt">root@glyfesse&gt; <b>glyfe</b> --edition 3</span>
      <span class="vol">vol.1 · #3 · the blue square</span>
    </div>

    <div class="mid">
      <div class="wordmark">GLYFESSE</div>
      <p class="tagline">The first playable thing:<br><span class="acc">a blue square that walks</span>,<br>slides, and bumps into walls.</p>
    </div>

    <div class="foot">
      <span class="voz">// by <b>Gus</b>, who that month was still a square</span>
      <span class="url">gusworld.site</span>
    </div>
  </div>

  <div class="tela" aria-hidden="true">
    <span class="interior">
      <img class="frame" src="../../public_html/assets/frames/edicao-3.png" alt="">
      <span class="varredura"></span>
      <span class="vinheta"></span>
    </span>
  </div>
</body>
</html>
