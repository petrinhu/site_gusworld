<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glyfesse #2 Architecture, OG card 1200x630 (EN)</title>
<!-- ★ O GEMEO EN de og-card-2.html (Edicao #2). Existe porque a CAPA da estante
     do /en/ tem que estar em ingles (ordem do lider, 2026-07-25): o card SOCIAL
     (og:image) segue sendo o de PORTUGUES nos dois idiomas, entao este arquivo
     gera SO' a arte de capa, nunca a meta tag.
     Desenho: og-card.css (chassi) + og-card-2.css (o painel do Gus 3D). O que
     muda aqui e' so' o TEXTO; o acento ciano cai na MESMA parte da frase.
     Render: ver o cabecalho de og-card.css. Saida: public_html/assets/og-edicao-2-en.jpg. -->
<link rel="stylesheet" href="og-card.css">
<link rel="stylesheet" href="og-card-2.css">
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="prompt">root@glyfesse&gt; <b>glyfe</b> --edition 2</span>
      <span class="vol">vol.1 · #2 · architecture</span>
    </div>

    <div class="mid">
      <div class="wordmark">GLYFESSE</div>
      <p class="tagline">the month the world<br><span class="acc">learned to stand up</span>.</p>
    </div>

    <div class="foot">
      <span class="voz">// by <b>Gus</b>, who doesn&rsquo;t know how much ground is left</span>
      <span class="url">gusworld.site</span>
    </div>
  </div>

  <div class="tela" aria-hidden="true">
    <span class="sombra"></span>
    <span class="interior">
      <span class="chao"></span>
      <span class="halo"></span>
      <span class="varredura"></span>
    </span>
    <img class="gus" src="og-2-gus-recorte.png" alt="">
  </div>
</body>
</html>
