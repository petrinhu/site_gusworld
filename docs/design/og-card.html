<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Glyfesse, OG card 1200x630</title>
<!-- Card social 1200x630 da Edicao #1, em PORTUGUES. O gemeo em ingles (a CAPA
     da estante do /en/) e' og-card-en.html: mesmo desenho, so' o texto muda.
     Desenho: og-card.css (chassi) + og-card-1.css (a arena do quadradinho).
     Render: ver o cabecalho de og-card.css. Saida publicada em
     public_html/assets/og-launch.jpg (social, pt) e og-edicao-1-en.jpg (capa en). -->
<link rel="stylesheet" href="og-card.css">
<link rel="stylesheet" href="og-card-1.css">
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="prompt">root@glyfesse&gt; <b>glyfe</b> --edicao 1</span>
      <span class="vol">vol.1 · #1 · a gênese</span>
    </div>

    <div class="mid">
      <div class="wordmark">GLYFESSE</div>
      <p class="tagline">a revista de um jogo <span class="acc">que ainda não saiu</span>.<br>escrita por quem mora dentro dele.</p>
    </div>

    <div class="foot">
      <span class="voz">// por <b>Gus</b>, que ainda não sabe que é o herói</span>
      <span class="url">gusworld.site</span>
    </div>
  </div>

  <div class="arena" aria-hidden="true">
    <span class="wall w1"></span>
    <span class="wall w2"></span>
    <span class="wall w3"></span>
    <span class="ghost g1"></span>
    <span class="ghost g2"></span>
    <span class="ghost g3"></span>
    <span class="hero"></span>
  </div>
</body>
</html>
