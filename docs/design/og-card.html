<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Glyfesse, OG card 1200x630</title>
<style>
  /* Card social 1200x630 da Glyfesse. E uma TELA (a tela do Tavus-Drive):
     navy full-bleed, ciano que brilha, scanlines CRT. Fontes self-hosted
     por file:// para o render headless carregar antes da captura. */
  @font-face {
    font-family: "Archivo Narrow";
    src: url("../../public_html/assets/fonts/archivo-narrow-latin-700-normal.woff2") format("woff2");
    font-weight: 700; font-display: block;
  }
  @font-face {
    font-family: "Vollkorn";
    src: url("../../public_html/assets/fonts/vollkorn-latin-400-normal.woff2") format("woff2");
    font-weight: 400; font-display: block;
  }
  @font-face {
    font-family: "PixelOperatorMono";
    src: url("../../public_html/assets/fonts/PixelOperatorMono.woff2") format("woff2");
    font-weight: 400; font-display: block;
  }

  :root {
    --navy:      #0d1520;
    --navy-alto: #1a2436;
    --ciano:     #4dd9e8;
    --ciano-alto:#6ff0ff;
    --magenta:   #cd58e1;
    --tela-1:    #dce8f5; /* AAA sobre navy */
    --tela-2:    #9fb2c8;
    --tela-3:    #798da2;
    --borda:     #486486;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1200px; height: 630px; }

  body {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(120% 130% at 82% 18%, rgba(77,217,232,.16), transparent 46%),
      radial-gradient(90% 120% at 8% 100%, rgba(205,88,225,.10), transparent 55%),
      linear-gradient(160deg, #101b29 0%, var(--navy) 55%, #0a1017 100%);
    font-family: "Vollkorn", Georgia, serif;
    color: var(--tela-1);
  }

  /* scanlines CRT sutis: a tela varrida por linha */
  body::before {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,.16) 3px,
      rgba(0,0,0,0) 4px
    );
    pointer-events: none;
    mix-blend-mode: multiply;
    opacity: .5;
  }
  /* vinheta: foca o centro, aprofunda a moldura da tela */
  body::after {
    content: "";
    position: absolute; inset: 0;
    box-shadow: inset 0 0 160px 40px rgba(0,0,0,.55);
    pointer-events: none;
  }

  .card {
    position: relative;
    z-index: 2;
    width: 100%; height: 100%;
    padding: 74px 84px;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  /* topo: a linha de expediente em mono (o masthead da tela) */
  .top {
    display: flex; align-items: center; justify-content: space-between;
    font-family: "PixelOperatorMono", monospace;
    font-size: 22px;
    letter-spacing: .04em;
    color: var(--ciano);
    text-shadow: 0 0 14px rgba(77,217,232,.45);
  }
  .top .prompt { color: var(--tela-3); }
  .top .prompt b { color: var(--ciano-alto); font-weight: 400; }
  .top .vol { color: var(--tela-2); text-shadow: none; }

  /* miolo: o wordmark gigante + a tagline */
  .mid {
    align-self: center;
    display: flex;
    flex-direction: column;
    gap: 26px;
    max-width: 700px;
  }

  .wordmark {
    font-family: "Archivo Narrow", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 150px;
    line-height: .84;
    letter-spacing: -.01em;
    color: var(--tela-1);
    text-shadow:
      0 0 2px rgba(220,232,245,.9),
      0 0 26px rgba(77,217,232,.55),
      0 0 60px rgba(77,217,232,.28);
  }

  .tagline {
    font-family: "Vollkorn", Georgia, serif;
    font-size: 38px;
    line-height: 1.25;
    color: var(--tela-2);
    max-width: 700px;
  }
  .tagline .acc { color: var(--ciano-alto); }

  /* rodape: credito da voz + a marca da tela */
  .foot {
    display: flex; align-items: flex-end; justify-content: space-between;
    font-family: "PixelOperatorMono", monospace;
    font-size: 21px;
    color: var(--tela-3);
  }
  .foot .voz { color: var(--tela-2); }
  .foot .voz b { color: var(--ciano); font-weight: 400; }
  .foot .url { color: var(--ciano); text-shadow: 0 0 12px rgba(77,217,232,.4); }

  /* O QUADRADINHO ciano: o heroi do jogo dentro da tela, com trilha e sala. */
  .arena {
    position: absolute;
    z-index: 2;
    right: 84px; top: 196px;
    width: 288px; height: 206px;
    border: 2px solid var(--borda);
    background:
      linear-gradient(180deg, rgba(26,36,54,.55), rgba(13,21,32,.2));
    box-shadow:
      inset 0 0 40px rgba(0,0,0,.5),
      0 0 0 6px rgba(13,21,32,.6);
  }
  /* paredes da sala (ecoam o mock 05) */
  .arena .wall {
    position: absolute;
    background: var(--navy-alto);
    border: 1px solid #2b3c56;
  }
  .arena .w1 { left: 20%; top: 16%; width: 34%; height: 12%; }
  .arena .w2 { left: 62%; top: 30%; width: 12%; height: 34%; }
  .arena .w3 { left: 24%; top: 66%; width: 28%; height: 11%; }

  /* a trilha do quadradinho (fantasmas esmaecendo) */
  .arena .ghost {
    position: absolute;
    width: 30px; height: 30px;
    background: var(--ciano);
    border-radius: 2px;
  }
  .arena .g1 { left: 18%; top: 44%; opacity: .12; }
  .arena .g2 { left: 30%; top: 46%; opacity: .22; }
  .arena .g3 { left: 42%; top: 48%; opacity: .40; }

  .arena .hero {
    position: absolute;
    left: 54%; top: 50%;
    width: 34px; height: 34px;
    background: linear-gradient(160deg, var(--ciano-alto), var(--ciano));
    border-radius: 3px;
    box-shadow:
      0 0 18px 4px rgba(77,217,232,.75),
      0 0 40px 10px rgba(77,217,232,.35);
  }
  .arena .hero::after { /* os "óculos" do Gus: um risco escuro */
    content: "";
    position: absolute;
    left: 5px; right: 5px; top: 12px; height: 5px;
    background: rgba(13,21,32,.85);
    border-radius: 1px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="prompt">root@glyfesse&gt; <b>glyfe</b> --edicao 1</span>
      <span class="vol">vol.1 · #1 · a gênese</span>
    </div>

    <div class="mid">
      <div class="wordmark">GLYFESSE</div>
      <p class="tagline">a revista de um jogo <span class="acc">que ainda não saiu</span>.<br>escrita por quem mora dentro dele.</p>
    </div>

    <div class="foot">
      <span class="voz">// por <b>Gus</b>, que ainda não sabe que é o herói</span>
      <span class="url">gusworld.site</span>
    </div>
  </div>

  <div class="arena" aria-hidden="true">
    <span class="wall w1"></span>
    <span class="wall w2"></span>
    <span class="wall w3"></span>
    <span class="ghost g1"></span>
    <span class="ghost g2"></span>
    <span class="ghost g3"></span>
    <span class="hero"></span>
  </div>
</body>
</html>
