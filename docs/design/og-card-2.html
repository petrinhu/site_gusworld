<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Glyfesse #2 Arquitetura, OG card 1200x630</title>

<!-- Card social 1200x630 da Edicao #2, em PORTUGUES. O gemeo em ingles (a CAPA
     da estante do /en/) e' og-card-2-en.html: mesmo desenho, so' o texto muda.
     Desenho: og-card.css (chassi) + og-card-2.css (o painel do Gus 3D).
     Render: ver o cabecalho de og-card.css. Saida publicada em
     public_html/assets/og-edicao-2.jpg (social, pt) e og-edicao-2-en.jpg (capa en). -->
<link rel="stylesheet" href="og-card.css">
<link rel="stylesheet" href="og-card-2.css">
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="prompt">root@glyfesse&gt; <b>glyfe</b> --edicao 2</span>
      <span class="vol">vol.1 · #2 · arquitetura</span>
    </div>

    <div class="mid">
      <div class="wordmark">GLYFESSE</div>
      <p class="tagline">o mês em que o mundo<br><span class="acc">aprendeu a ficar de pé</span>.</p>
    </div>

    <div class="foot">
      <span class="voz">// por <b>Gus</b>, que ainda não sabe quanto chão falta</span>
      <span class="url">gusworld.site</span>
    </div>
  </div>

  <div class="tela" aria-hidden="true">
    <span class="sombra"></span>
    <span class="interior">
      <span class="chao"></span>
      <span class="halo"></span>
      <span class="varredura"></span>
    </span>
    <img class="gus" src="og-2-gus-recorte.png" alt="">
  </div>
</body>
</html>
