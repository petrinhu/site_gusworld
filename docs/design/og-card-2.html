<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Glyfesse #2 Arquitetura, OG card 1200x630</title>
<style>
  /* Card social 1200x630 da Glyfesse, Edicao #2 "Arquitetura". Mesma identidade
     do og-card.html (a #1): navy full-bleed, ciano que brilha, scanlines CRT,
     fontes self-hosted por file:// para o render headless carregar antes da
     captura. O que muda e' o painel da direita: no lugar do quadradinho, o
     POSTER 3D do Gus, recortado do fundo branco (og-2-gus-recorte.png) e posto
     de pe' num chao em perspectiva, pisando FORA da moldura. A edicao e' sobre
     fundacao, entao o card mostra o chao e a figura em pe' sobre ele.

     Render (mesmo metodo da #1):
       chromium-browser --headless --disable-gpu --hide-scrollbars \
         --force-device-scale-factor=1 --window-size=1200,630 \
         --screenshot=og-edicao-2.png --virtual-time-budget=4000 \
         file:///caminho/absoluto/docs/design/og-card-2.html
     Depois converter para JPG q85 e publicar em
     public_html/assets/og-edicao-2.jpg. */
  @font-face {
    font-family: "Archivo Narrow";
    src: url("../../public_html/assets/fonts/archivo-narrow-latin-700-normal.woff2") format("woff2");
    font-weight: 700; font-display: block;
  }
  @font-face {
    font-family: "Vollkorn";
    src: url("../../public_html/assets/fonts/vollkorn-latin-400-normal.woff2") format("woff2");
    font-weight: 400; font-display: block;
  }
  @font-face {
    font-family: "PixelOperatorMono";
    src: url("../../public_html/assets/fonts/PixelOperatorMono.woff2") format("woff2");
    font-weight: 400; font-display: block;
  }

  :root {
    --navy:      #0d1520;
    --navy-alto: #1a2436;
    --ciano:     #4dd9e8;
    --ciano-alto:#6ff0ff;
    --magenta:   #cd58e1;
    --tela-1:    #dce8f5; /* AAA sobre navy */
    --tela-2:    #9fb2c8;
    --tela-3:    #798da2;
    --borda:     #486486;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1200px; height: 630px; }

  body {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(120% 130% at 82% 18%, rgba(77,217,232,.16), transparent 46%),
      radial-gradient(90% 120% at 8% 100%, rgba(205,88,225,.10), transparent 55%),
      linear-gradient(160deg, #101b29 0%, var(--navy) 55%, #0a1017 100%);
    font-family: "Vollkorn", Georgia, serif;
    color: var(--tela-1);
  }

  /* scanlines CRT sutis: a tela varrida por linha */
  body::before {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,.16) 3px,
      rgba(0,0,0,0) 4px
    );
    pointer-events: none;
    mix-blend-mode: multiply;
    opacity: .5;
  }
  /* vinheta: foca o centro, aprofunda a moldura da tela */
  body::after {
    content: "";
    position: absolute; inset: 0;
    box-shadow: inset 0 0 160px 40px rgba(0,0,0,.55);
    pointer-events: none;
  }

  .card {
    position: relative;
    z-index: 2;
    width: 100%; height: 100%;
    padding: 74px 84px;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  /* topo: a linha de expediente em mono (o masthead da tela) */
  .top {
    display: flex; align-items: center; justify-content: space-between;
    font-family: "PixelOperatorMono", monospace;
    font-size: 22px;
    letter-spacing: .04em;
    color: var(--ciano);
    text-shadow: 0 0 14px rgba(77,217,232,.45);
  }
  .top .prompt { color: var(--tela-3); }
  .top .prompt b { color: var(--ciano-alto); font-weight: 400; }
  .top .vol { color: var(--tela-2); text-shadow: none; }

  /* miolo: o wordmark gigante + a tagline */
  .mid {
    align-self: center;
    display: flex;
    flex-direction: column;
    gap: 26px;
    max-width: 700px;
  }

  .wordmark {
    font-family: "Archivo Narrow", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 150px;
    line-height: .84;
    letter-spacing: -.01em;
    color: var(--tela-1);
    text-shadow:
      0 0 2px rgba(220,232,245,.9),
      0 0 26px rgba(77,217,232,.55),
      0 0 60px rgba(77,217,232,.28);
  }

  .tagline {
    font-family: "Vollkorn", Georgia, serif;
    font-size: 38px;
    line-height: 1.25;
    color: var(--tela-2);
    max-width: 700px;
  }
  .tagline .acc { color: var(--ciano-alto); }

  /* rodape: credito da voz + a marca da tela */
  .foot {
    display: flex; align-items: flex-end; justify-content: space-between;
    font-family: "PixelOperatorMono", monospace;
    font-size: 21px;
    color: var(--tela-3);
  }
  .foot .voz { color: var(--tela-2); }
  .foot .voz b { color: var(--ciano); font-weight: 400; }
  .foot .url { color: var(--ciano); text-shadow: 0 0 12px rgba(77,217,232,.4); }

  /* ── O PAINEL: a tela onde o Gus 3D esta' de pe' ─────────────────────────── */
  .tela {
    position: absolute;
    z-index: 2;
    right: 84px; top: 168px;
    width: 300px; height: 324px;
    border: 2px solid var(--borda);
    background: linear-gradient(180deg, rgba(26,36,54,.62), rgba(13,21,32,.28));
    box-shadow:
      inset 0 0 40px rgba(0,0,0,.5),
      0 0 0 6px rgba(13,21,32,.6);
  }

  /* o INTERIOR recorta tudo que e' "conteudo de tela" (chao, halo, varredura).
     A figura fica FORA dele, e por isso pode transbordar a moldura. */
  .tela .interior {
    position: absolute; inset: 0;
    overflow: hidden;
  }

  /* o chao em perspectiva: o grid de fundacao (o tema da edicao) */
  .tela .chao {
    position: absolute;
    left: -40%; right: -40%; bottom: 0; height: 62%;
    transform: perspective(260px) rotateX(66deg);
    transform-origin: bottom center;
    background-image:
      repeating-linear-gradient(to right, rgba(77,217,232,.42) 0 1px, transparent 1px 46px),
      repeating-linear-gradient(to bottom, rgba(77,217,232,.32) 0 1px, transparent 1px 46px);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 42%, #000 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, #000 42%, #000 100%);
  }

  /* halo: a luz da tela batendo atras da figura */
  .tela .halo {
    position: absolute;
    left: 50%; bottom: 8%;
    width: 300px; height: 300px;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(77,217,232,.46), rgba(77,217,232,.16) 44%, transparent 72%);
  }

  /* scanlines locais: dentro da moldura a varredura e' mais forte */
  .tela .varredura {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,.22) 3px,
      rgba(0,0,0,0) 4px
    );
  }

  /* a figura: recortada do poster (fundo branco removido no pre-processo) e
     PISANDO FORA da moldura, para nao virar adesivo colado. */
  .gus {
    position: absolute;
    left: 50%; bottom: -34px;
    width: 213px; height: 400px;
    transform: translateX(-50%);
    filter:
      drop-shadow(0 0 22px rgba(77,217,232,.34))
      drop-shadow(0 12px 18px rgba(0,0,0,.55));
  }

  /* sombra de contato: ancora as botas no chao do card, fora da moldura, para a
     figura nao parecer flutuando abaixo da tela. Mesmo eixo horizontal do Gus. */
  .tela .sombra {
    position: absolute;
    left: 50%; bottom: -46px;
    width: 196px; height: 30px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(0,0,0,.72), rgba(0,0,0,.3) 45%, transparent 72%);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="prompt">root@glyfesse&gt; <b>glyfe</b> --edicao 2</span>
      <span class="vol">vol.1 · #2 · arquitetura</span>
    </div>

    <div class="mid">
      <div class="wordmark">GLYFESSE</div>
      <p class="tagline">o mês em que o mundo<br><span class="acc">aprendeu a ficar de pé</span>.</p>
    </div>

    <div class="foot">
      <span class="voz">// por <b>Gus</b>, que ainda não sabe quanto chão falta</span>
      <span class="url">gusworld.site</span>
    </div>
  </div>

  <div class="tela" aria-hidden="true">
    <span class="sombra"></span>
    <span class="interior">
      <span class="chao"></span>
      <span class="halo"></span>
      <span class="varredura"></span>
    </span>
    <img class="gus" src="og-2-gus-recorte.png" alt="">
  </div>
</body>
</html>
